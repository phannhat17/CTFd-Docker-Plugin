# Build the VitePress documentation site and publish it to Cloudflare Pages.
#
# Two secrets are required in the repository settings:
#   CLOUDFLARE_API_TOKEN   token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  account id from the Cloudflare dashboard
#
# If you prefer the dashboard Git integration instead, skip this workflow and
# set the build command to `npm run docs:build` and the output directory to
# `docs/.vitepress/dist` in the Pages project settings. Do not use both, or the
# site is deployed twice per push.
name: docs

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the site
        run: npm run docs:build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/.vitepress/dist --project-name=ctfd-containers-docs
